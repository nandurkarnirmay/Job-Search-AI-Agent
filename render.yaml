# Render Blueprint: four deploy units built from the same backend code (SERVICE selects the routers).
# Postgres = Neon, Redis = Upstash. The Next.js app on Vercel is the gateway (frontend/next.config.mjs).
#
# Free-tier note: each service sleeps after ~15 min idle and Render's free plan gives 750 instance-hours/month
# per workspace in total. For a low-cost demo you can run ONE service with SERVICE=all instead (see docs/DEPLOY.md);
# the code is identical.
envVarGroups:
  - name: job-agent-shared
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: JWT_SECRET            # every service verifies tokens itself, so all must share it
        generateValue: true
      - key: FIELD_ENCRYPTION_KEYS # encryption at rest for resumes, answers, chats, notes
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL        # https://<vercel-app>/api (the gateway), used in email/calendar links
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        generateValue: true

services:
  - type: web
    name: job-agent-jobs
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false   # deploys are triggered by GitHub Actions only after tests pass
    envVars:
      - fromGroup: job-agent-shared
      - key: SERVICE
        value: jobs
      - key: AUTO_MIGRATE   # only this unit runs migrations
        value: "true"
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: WIKIPEDIA_ENABLED
        value: "true"
      - key: CRON_TOKEN
        generateValue: true   # copy into the GitHub secret CRON_TOKEN
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: job-agent-auth
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: job-agent-shared
      - key: SERVICE
        value: auth
      - key: AUTO_MIGRATE
        value: "false"

  - type: web
    name: job-agent-resume
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: job-agent-shared
      - key: SERVICE
        value: resume
      - key: AUTO_MIGRATE
        value: "false"

  - type: web
    name: job-agent-interview
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - fromGroup: job-agent-shared
      - key: SERVICE
        value: interview
      - key: AUTO_MIGRATE
        value: "false"
