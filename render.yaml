# Render Blueprint for the backend. Postgres = Neon, Redis = Upstash (both free, set as env vars).
services:
  - type: web
    name: job-search-agent-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false   # deploys are triggered by GitHub Actions only after tests pass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: AUTO_MIGRATE
        value: "true"     # Alembic upgrade on startup; a Week 2 database is stamped and upgraded in place
      - key: WIKIPEDIA_ENABLED
        value: "true"
      - key: CRON_TOKEN
        generateValue: true   # copy it into the GitHub secret CRON_TOKEN
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
